<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Antigravity Exam Viewer{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;750&display=swap" rel="stylesheet">
    
    <!-- MathJax Configuration for Inline $...$ and Block $$...$$ -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Custom Notion-like minimalist styling -->
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #37352f;
        }
        
        /* Exam Paper aesthetics - Notion clean document layout */
        .exam-paper {
            font-family: 'Georgia', serif;
            background-color: #ffffff;
            color: #37352f;
            border: 1px solid #e9e9e6;
            border-radius: 8px;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f7f7f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #dfdfde;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c1c1c0;
        }

        /* Notion side panels & container blocks */
        .glass-panel {
            background-color: #f7f7f5;
            border: 1px solid #e9e9e6;
            border-radius: 6px;
        }
        
        /* Sequence Labeling Tag Highlights - Soft Pastel Notion style */
        .tag-question_label {
            background-color: #e8f4fc !important; /* Light Blue */
            border-bottom: 2px solid #2e8ae6 !important;
            padding: 0 2px;
            border-radius: 2px;
            color: #0b5b9e !important;
            font-weight: 600;
        }
        .tag-stem {
            background-color: #f5f0f8 !important; /* Light Purple */
            border-bottom: 2px solid #8e4ec6 !important;
            padding: 0 2px;
            border-radius: 2px;
            color: #5c2c8f !important;
        }
        .tag-option_label {
            background-color: #fdf5d3 !important; /* Light Yellow */
            border-bottom: 2px solid #d4a017 !important;
            padding: 0 2px;
            border-radius: 2px;
            color: #8f6b00 !important;
            font-weight: 600;
        }
        .tag-option_text {
            background-color: #edf6ec !important; /* Light Green */
            border-bottom: 2px solid #3fa63f !important;
            padding: 0 2px;
            border-radius: 2px;
            color: #1e5a1e !important;
        }
        .tag-context {
            background-color: #fdebee !important; /* Light Red */
            border-bottom: 2px solid #e03b3b !important;
            padding: 0 2px;
            border-radius: 2px;
            color: #9c1a1a !important;
        }
        
        .tag-token {
            position: relative;
        }
        
        .tag-highlight-active .tag-token:hover {
            filter: brightness(0.97);
            cursor: help;
        }

        /* Style for custom <blank> tags in English exams */
        blank {
            display: inline-block;
            min-width: 60px;
            border-bottom: 1.5px solid currentColor;
            margin: 0 4px;
            height: 12px;
            vertical-align: middle;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col selection:bg-[#2eaadc]/30 selection:text-inherit">
    
    <!-- Top Notion-like Navigation Bar -->
    <header class="border-b border-[#e9e9e6] bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2.5 group">
                <div class="h-7 w-7 rounded bg-[#efefed] flex items-center justify-center text-[#37352f] font-bold border border-[#e9e9e6] text-xs">
                    📝
                </div>
                <div>
                    <span class="font-semibold text-sm text-[#37352f] group-hover:text-black transition-colors duration-150">Antigravity Viewer</span>
                    <span class="inline-block text-[10px] text-stone-500 font-medium px-1.5 py-0.5 rounded bg-stone-100 ml-2 border border-stone-200">Seq Labelling</span>
                </div>
            </a>
            <div class="flex items-center space-x-3">
                <a href="/random" class="px-3 py-1.5 rounded border border-[#e9e9e6] hover:bg-[#efefed] text-[#37352f] text-xs font-medium transition-all duration-150 flex items-center space-x-1.5">
                    <svg class="h-3.5 w-3.5 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3m0 0l3 3m-3-3v12" />
                    </svg>
                    <span>Lấy Đề Ngẫu Nhiên</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col bg-[#ffffff]">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-[#e9e9e6] bg-[#f7f7f5] py-5 text-center text-xs text-[#838380]">
        <div class="max-w-7xl mx-auto px-6">
            <p>© 2026 Antigravity sequence-labelling-data-generator. Hệ thống trực quan hoá dữ liệu đề thi tự động.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
