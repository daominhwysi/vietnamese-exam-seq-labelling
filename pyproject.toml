[project]
dependencies = []
name = "sequence-labelling-data-generator"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
sequence-labelling-generator = "src.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
sequence_labelling_data_generator = { path = ".", editable = true }

[tool.pixi.tasks]
generate = "sequence-labelling-generator question"
prepare-dataset = "sequence-labelling-generator prepare"
upload-dataset = "sequence-labelling-generator upload"
compile-exams = "sequence-labelling-generator exam"
train = "sequence-labelling-generator train"
visualize = "sequence-labelling-generator visualize"
test = "python -m unittest discover -s tests"

[tool.pixi.dependencies]
python = ">=3.14.5,<3.15"
openai = ">=2.38.0,<3"
python-dotenv = ">=1.2.2,<2"
tqdm = ">=4.67.3,<5"
transformers = ">=5.9.0,<6"
sentencepiece = ">=0.2.1,<0.3"

[tool.hatch.build.targets.wheel]
packages = ["src"]
