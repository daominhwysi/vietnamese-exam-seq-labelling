[project]
dependencies = []
name = "sequence-labelling-data-generator"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
sequence-labelling-generator = "src.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
sequence_labelling_data_generator = { path = ".", editable = true }

[tool.pixi.tasks]
generate = "sequence-labelling-generator exam"
prepare-dataset = "sequence-labelling-generator prepare --model jhu-clsp/mmbert-base --exam-level"
upload-dataset = "sequence-labelling-generator upload"
train = "sequence-labelling-generator train --model_name jhu-clsp/mmbert-base"
visualize = "sequence-labelling-generator visualize"
test = "python -m unittest discover -s tests"
batch-inference = "python src/training/inference_folder.py"
view-exams = "uvicorn src.webapp.main:app --host 127.0.0.1 --port 8000 --reload"

[tool.pixi.dependencies]
python = ">=3.14.5,<3.15"
openai = ">=2.38.0,<3"
python-dotenv = ">=1.2.2,<2"
tqdm = ">=4.67.3,<5"
transformers = ">=5.9.0,<6"
sentencepiece = ">=0.2.1,<0.3"
fastapi = ">=0.115.0,<1"
jinja2 = ">=3.1.0,<4"
uvicorn = ">=0.30.0,<1"

[tool.hatch.build.targets.wheel]
packages = ["src"]
