[project]
dependencies = ["openai", "pymupdf>=1.27.2.3,<2", "openai-codex>=0.147.0,<0.148"]
name = "sequence-labelling-data-generator"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
sequence-labelling-generator = "src.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
sequence_labelling_data_generator = { path = ".", editable = true }
torch = "*"
peft = "*"
accelerate = "*"

[tool.pixi.tasks]
generate = "sequence-labelling-generator exam"
prepare-offline-dataset = "sequence-labelling-generator prepare --model jhu-clsp/mmBERT-base --exam-level"
prepare-dataset = "sequence-labelling-generator prepare --model jhu-clsp/mmBERT-base --exam-level"
consolidate-raw = "sequence-labelling-generator consolidate-raw"
fix-root-data = "python src/data/fix_root_data.py --input-dir output"
upload-dataset = "sequence-labelling-generator upload"
upload-online-dataset = "sequence-labelling-generator upload --mode online-only"
train = "sequence-labelling-generator train --model_name jhu-clsp/mmBERT-base"
upload-model = "sequence-labelling-generator upload-model"
visualize = "sequence-labelling-generator visualize"
test = "python -m unittest discover -s tests"
batch-inference = "python src/inference/predict_folder.py"
view-exams = "uvicorn src.webapp.main:app --host 127.0.0.1 --port 8000 --reload"
view-inference = "uvicorn src.webapp.inference_app:app --host 127.0.0.1 --port 8001 --reload"

[tool.pixi.dependencies]
python = ">=3.14.5,<3.15"
openai = "*"
python-dotenv = ">=1.2.2,<2"
pyyaml = ">=6.0"
tqdm = ">=4.67.3,<5"
transformers = ">=5.9.0,<6"
sentencepiece = ">=0.2.1,<0.3"
fastapi = ">=0.115.0,<1"
jinja2 = ">=3.1.0,<4"
uvicorn = ">=0.30.0,<1"
onnx = "*"
onnxruntime = ">=1.26.0,<2"
pillow = ">=12.3.0,<13"

[tool.hatch.build.targets.wheel]
packages = ["src"]
